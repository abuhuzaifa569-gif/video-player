name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q VideoPlayer.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk VideoPlayer.apk
          gh release create v3.1 VideoPlayer.apk --title "Video Player v3.1 - FINAL" --notes "Video Player FINAL APK (debug build, API 35) - direct download. Final: Moiz icon, Quicksand font, app pages (About/Help/Privacy/Licenses), Auto Test removed." || gh release upload v3.1 VideoPlayer.apk --clobber
